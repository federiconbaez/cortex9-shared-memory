name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install tools
        run: python -m pip install --upgrade pip pytest ruff mypy
      - name: Lint (ruff)
        run: ruff check cortex9_memory tests
      - name: Typecheck (mypy)
        run: mypy cortex9_memory
      - name: Tests (pytest)
        run: pytest -v
      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
